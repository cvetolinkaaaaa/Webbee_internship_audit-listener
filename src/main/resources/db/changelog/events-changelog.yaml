databaseChangeLog:
  - changeSet:
      id: 1
      author: audit-system
      comment: Создание таблицы для хранения Audit событий
      changes:
        - createTable:
            tableName: audit_events
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: log_level
                  type: VARCHAR(20)
                  constraints:
                    nullable: true
              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: correlation_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: method_name
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: arguments
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: result
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: error_message
                  type: TEXT
                  constraints:
                    nullable: true
      rollback:
        - dropTable:
            tableName: audit_events